apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: target-app }
  template:
    metadata:
      labels: { app: target-app }
    spec:
      containers:
        - name: target-app
          image: target-app:0.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: lab
spec:
  selector: { app: target-app }
  ports:
    - port: 80
      targetPort: 8000
